<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIGO · Responsive preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7e1;font:13px Arial;color:#24333b}header{height:62px;display:flex;align-items:center;gap:20px;padding:0 25px;border-bottom:1px solid #cdd1c7;background:#f7f5f0}header strong{letter-spacing:3px;font-size:20px}a{color:inherit}button{border:1px solid #bfc6bb;background:none;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#24333b;color:white}main{display:flex;justify-content:center;padding:24px 14px}iframe{display:block;border:0;background:#f7f5f0;box-shadow:0 12px 45px #24333b18;border-radius:12px;width:390px;height:844px}body.desktop iframe{width:1440px;height:960px;border-radius:3px}small{margin-left:auto;color:#68706d}@media(max-width:600px){header{padding:12px;gap:10px;flex-wrap:wrap;height:auto}small{display:none}main{padding:12px 0}iframe{max-width:100vw;border-radius:0;box-shadow:none}}</style></head><body><header><strong>DIGO</strong><button id="mobile">Mobile · 390</button><button id="desktop">Desktop · 1440</button><a href="/">Open full site ↗</a><small>Responsive, interactive preview</small></header><main><iframe title="DIGO responsive preview" src="/"></iframe></main><script>const mode=new URLSearchParams(location.search).get('mode')||'mobile';function setMode(m){document.body.classList.toggle('desktop',m==='desktop');document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.id===m));history.replaceState(null,'','?mode='+m)}document.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.id));setMode(mode);</script></body></html>
