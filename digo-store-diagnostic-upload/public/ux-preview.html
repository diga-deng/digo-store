<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DIGO · Responsive preview</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e9e7e1;font:13px Arial;color:#24333b}
    header{min-height:62px;display:flex;align-items:center;gap:20px;padding:12px 25px;border-bottom:1px solid #cdd1c7;background:#f7f5f0}
    header strong{letter-spacing:3px;font-size:20px}a{color:inherit}
    button{border:1px solid #bfc6bb;background:none;padding:9px 15px;cursor:pointer}
    button[aria-pressed=true]{background:#24333b;color:white}
    main{display:flex;justify-content:center;padding:24px 14px}
    .preview-stage{width:min(390px,100%);height:844px;border-radius:12px;overflow:hidden;box-shadow:0 12px 45px #24333b18}
    iframe{display:block;border:0;background:#f7f5f0;width:100%;height:844px}
    body.desktop .preview-stage{width:min(1440px,100%);height:calc(960px * var(--preview-scale,1));border-radius:3px}
    body.desktop iframe{width:1440px;height:960px;transform:scale(var(--preview-scale,1));transform-origin:0 0}
    small{margin-left:auto;color:#68706d}
    @media(max-width:600px){header{padding:12px;gap:10px;flex-wrap:wrap}small{display:none}main{padding:12px 0}.preview-stage{border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header><strong>DIGO</strong><button id="mobile">Mobile · 390</button><button id="desktop">Desktop · 1440</button><a href="/">Open full site ↗</a><small>Responsive, interactive preview</small></header>
  <main><div class="preview-stage" id="preview-stage"><iframe title="DIGO responsive preview" src="/"></iframe></div></main>
  <script>
    const stage=document.querySelector('#preview-stage');
    function fitPreview(){stage.style.setProperty('--preview-scale',Math.min(1,stage.getBoundingClientRect().width/1440));}
    function setMode(mode){
      const m=mode==='desktop'?'desktop':'mobile';
      document.body.classList.toggle('desktop',m==='desktop');
      document.querySelectorAll('header button').forEach(button=>button.setAttribute('aria-pressed',button.id===m));
      history.replaceState(null,'','?mode='+m);
      fitPreview();
    }
    document.querySelectorAll('header button').forEach(button=>button.onclick=()=>setMode(button.id));
    new ResizeObserver(fitPreview).observe(stage);
    setMode(new URLSearchParams(location.search).get('mode'));
  </script>
</body>
</html>
